[package]
name = "linexus-nexus"
version = "0.1.0"
edition = "2024"
authors = ["Linexus Collective"]
description = "Control Plane — gRPC API, Tower middleware Permission Funnel, RBAC, Vicinagora governance"
license = "MIT"
repository = "https://github.com/chuckles-the-dancing-clown91/linexus-nexus"

[dependencies]
linexus-core = { git = "https://github.com/chuckles-the-dancing-clown91/linexus-core.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.13"
