[workspace]

[package]
name = "linexus-nexus"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "linexus_nexus-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "fs",
  "sync",
  "time",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
include_dir = { version = "0.7" }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
anyhow = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# Sealing provider credentials at rest (AES-256-GCM).
aes-gcm = { version = "0.10" }
# Signing the plans handed to agents (Ed25519).
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = { version = "0.22" }
# Native HTTPS / mTLS (`NEXUS_TLS_*`). rustls with ring only, as reqwest uses.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "logging",
  "tls12",
] }
rustls-pki-types = { version = "1.9", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
hyper = { version = "1" }
hyper-util = { version = "0.1", features = [
  "server-auto",
  "server-graceful",
  "service",
  "tokio",
] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "linexus_nexus-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
